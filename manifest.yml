modules:
  jira:issuePanel:
    - key: audit-ready-panel
      title: Audit Ready
      icon: resource:icons;audit.svg
      resource: panel
      resolver:
        function: resolver
      render: native
  jira:projectPage:
    - key: audit-ready-project
      title: Audit Readiness
      resource: project
      resolver:
        function: resolver
      render: native
  function:
    - key: resolver
      handler: index.handler
resources:
  - key: panel
    path: src/frontend/panel.jsx
  - key: project
    path: src/frontend/project.jsx
  - key: icons
    path: static
app:
  runtime:
    name: nodejs22.x
  id: ari:cloud:ecosystem::app/d449b687-66bc-4182-b4c7-7fca30b4aef0
permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - read:jira-user
